[workspace]
resolver = "3"
members = [
    "crates/lagwyrm-sim",
    "crates/lagwyrm-net",
    "crates/lagwyrm-server",
    "crates/lagwyrm-bot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
lagwyrm-sim = { path = "crates/lagwyrm-sim" }
lagwyrm-net = { path = "crates/lagwyrm-net" }
lagwyrm-server = { path = "crates/lagwyrm-server" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
